<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro Apps</title>
  <link rel="stylesheet" href="common/index.css">
</head>
<body class="dir-body">

  <aside class="dir-info">
    <h1>Micro Apps</h1>
    <p class="dir-sub">by Scott Quach</p>

    <p class="dir-desc">Single-purpose utilities built for speed and focus.</p>

    <ul class="dir-lines">
      <li>No sign-up required.</li>
      <li>No data collected.</li>
      <li>No unnecessary features.</li>
    </ul>

    <p class="dir-cta">Simple, but useful.</p>

    <div class="dir-filters" id="filters"></div>

    <div class="dir-footer">
      <div>By Scott Quach</div>
      <div id="last-updated"></div>
    </div>
  </aside>

  <main class="dir-main">
    <div class="dir-grid" id="card-grid"></div>
    <div class="dir-empty" id="empty-state">No apps in this category.</div>
  </main>

  <script>
    const apps = [
      {
        id: "promotion",
        icon: "🖼️",
        tag: "Design",
        name: "Promotion Mockup",
        path: "promotion-mockup/promotion_mockup.html",
        description: "Build social promotion images from uploaded screenshots."
      },
      {
        id: "timestamp",
        icon: "🕐",
        tag: "Utility",
        name: "Timestamp Converter",
        path: "timestamp-converter/timestamp_converter.html",
        description: "Convert timestamps across UTC, local time, RFC, and Unix formats."
      },
      {
        id: "json",
        icon: "{ }",
        tag: "Dev",
        name: "JSON Parser",
        path: "json-parser/json-parser.html",
        description: "Format, validate, inspect, and transform JSON."
      },
      {
        id: "base64",
        icon: "64",
        tag: "Dev",
        name: "Base64 Codec",
        path: "base64-codec/base64-codec.html",
        description: "Encode and decode Base64, URL-safe Base64, and Unicode text."
      },
      {
        id: "color",
        icon: "#",
        tag: "Design",
        name: "Color Toolkit",
        path: "color-toolkit/color-toolkit.html",
        description: "Convert colors, generate tints and shades, and check contrast."
      }
    ];

    const categories = ["All", ...new Set(apps.map((a) => a.tag))];
    let activeCategory = "All";

    const filtersEl = document.getElementById("filters");
    const gridEl    = document.getElementById("card-grid");
    const emptyEl   = document.getElementById("empty-state");
    const updatedEl = document.getElementById("last-updated");

    updatedEl.textContent = "Last updated " + new Date().toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "2-digit" });

    function countFor(cat) {
      return cat === "All" ? apps.length : apps.filter((a) => a.tag === cat).length;
    }

    function renderFilters() {
      filtersEl.innerHTML = "";
      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = "dir-filter" + (cat === activeCategory ? " active" : "");
        btn.innerHTML = `<span>${cat}</span><span class="dir-filter-count">${countFor(cat)}</span>`;
        btn.addEventListener("click", () => setCategory(cat));
        filtersEl.appendChild(btn);
      });
    }

    function renderGrid() {
      const visible = activeCategory === "All" ? apps : apps.filter((a) => a.tag === activeCategory);
      gridEl.querySelectorAll(".dir-card").forEach((c) => {
        c.hidden = !visible.some((a) => a.id === c.dataset.appId);
      });
      emptyEl.style.display = visible.length === 0 ? "block" : "none";
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderFilters();
      renderGrid();
    }

    function buildGrid() {
      apps.forEach((app) => {
        const a = document.createElement("a");
        a.className = "dir-card";
        a.href = app.path;
        a.dataset.appId = app.id;
        a.innerHTML = `
          <div class="dir-card-preview">
            <span class="dir-card-icon">${app.icon}</span>
            <span class="dir-card-desc">${app.description}</span>
          </div>
          <div class="dir-card-label">
            <span class="dir-card-name">${app.name}</span>
            <span class="dir-card-open">Open ↗</span>
          </div>
        `;
        gridEl.appendChild(a);
      });
    }

    buildGrid();
    renderFilters();
    renderGrid();
  </script>
</body>
</html>
