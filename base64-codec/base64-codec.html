<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Codec</title>
  <link rel="stylesheet" href="../common/index.css">
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
    }

    .app {
      width: 100%;
      max-width: 1600px;
      justify-self: center;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px minmax(0, 1fr);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .ph {
      height: 30px;
    }

    .editor {
      flex: 1;
      min-height: 0;
      width: 100%;
      resize: none;
      border: 0;
      background: transparent;
      color: var(--text);
      outline: none;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.65;
      white-space: pre;
      tab-size: 2;
    }

    .editor::placeholder {
      color: var(--text-muted);
    }

    .editor::selection {
      background: rgba(196, 150, 78, .15);
    }

    .panel:focus-within {
      outline: 1px solid rgba(196, 150, 78, .3);
      outline-offset: -1px;
    }

    .controls {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--surface2);
      min-width: 0;
    }

    .control-body {
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      overflow-y: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 32px;
      padding: 6px 12px;
      border: 1px solid var(--border2);
      border-radius: var(--r);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      transition: background var(--t), color var(--t), border-color var(--t);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-hi {
      background: var(--accent-dim);
      border-color: rgba(196, 150, 78, .35);
      color: var(--accent);
    }

    .btn-hi:hover {
      background: rgba(196, 150, 78, .18);
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.35;
      padding: 8px 0;
    }

    .toggle input {
      accent-color: var(--accent);
    }

    .sep {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    .stats {
      display: grid;
      gap: 6px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .stat-row span:last-child {
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .status {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.45;
      background: var(--surface);
      display: flex;
      align-items: center;
    }

    .status.ok {
      border-color: rgba(120, 168, 142, .28);
      color: var(--success);
      background: rgba(120, 168, 142, .08);
    }

    .status.err {
      border-color: rgba(192, 120, 120, .32);
      color: var(--error);
      background: rgba(192, 120, 120, .08);
    }

    .hint {
      margin-top: auto;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.55;
    }

    @media (max-width: 860px) {

      html,
      body {
        overflow: auto;
      }

      body { display: block; }

      .app-info {
        display: none;
      }

      .app {
        min-height: 100vh;
        height: auto;
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: 320px;
        border-bottom: 1px solid var(--border);
      }

      .controls {
        border-left: 0;
        border-right: 0;
        min-height: 0;
      }

      .control-body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        height: auto;
      }

      .stats,
      .status,
      .hint,
      .toggle,
      .sep {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <aside class="app-info">
    <a href="../index.html" class="app-info-back">← Home</a>
    <div class="app-info-name">
      <span class="app-info-mark">64</span>
      Base64 Codec
    </div>
    <p class="app-info-desc">Encode and decode Base64 and URL-safe Base64 strings.</p>
    <div class="app-info-sep"></div>
    <ul class="app-info-hints">
      <li>Paste text to encode or Base64 to decode.</li>
      <li>URL-safe uses - and _ instead of + and /.</li>
      <li>Line mode processes each line separately.</li>
    </ul>
  </aside>

  <main class="app">
    <section class="panel" aria-label="Plain text or Base64 input">
      <div class="ph">
        <span>Input</span>
        <span id="input-count">0 chars</span>
      </div>
      <textarea id="input" class="editor" spellcheck="false"
        placeholder="Paste text to encode, or Base64 to decode..."></textarea>
    </section>

    <aside class="controls" aria-label="Base64 controls">
      <div class="ph"><span>Codec</span></div>
      <div class="control-body">
        <button type="button" class="btn btn-hi" id="encode-button">Encode</button>
        <button type="button" class="btn btn-hi" id="decode-button">Decode</button>
        <button type="button" class="btn" id="swap-button">Swap</button>
        <button type="button" class="btn" id="copy-button">Copy</button>
        <button type="button" class="btn" id="sample-button">Sample</button>
        <button type="button" class="btn" id="clear-button">Clear</button>

        <div class="sep"></div>

        <label class="toggle">
          <input type="checkbox" id="url-safe">
          URL-safe Base64
        </label>
        <label class="toggle">
          <input type="checkbox" id="line-mode">
          Process each line separately
        </label>

        <div class="stats" aria-label="Text statistics">
          <div class="stat-row"><span>Input bytes</span><span id="input-bytes">0</span></div>
          <div class="stat-row"><span>Output bytes</span><span id="output-bytes">0</span></div>
          <div class="stat-row"><span>Mode</span><span id="mode-label">standard</span></div>
        </div>

        <div class="status" id="status">Ready.</div>
      </div>
    </aside>

    <section class="panel" aria-label="Base64 output">
      <div class="ph">
        <span>Output</span>
        <span id="output-count">0 chars</span>
      </div>
      <textarea id="output" class="editor" spellcheck="false" readonly></textarea>
    </section>
  </main>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const encodeButton = document.getElementById("encode-button");
    const decodeButton = document.getElementById("decode-button");
    const swapButton = document.getElementById("swap-button");
    const copyButton = document.getElementById("copy-button");
    const sampleButton = document.getElementById("sample-button");
    const clearButton = document.getElementById("clear-button");
    const urlSafe = document.getElementById("url-safe");
    const lineMode = document.getElementById("line-mode");
    const status = document.getElementById("status");
    const inputCount = document.getElementById("input-count");
    const outputCount = document.getElementById("output-count");
    const inputBytes = document.getElementById("input-bytes");
    const outputBytes = document.getElementById("output-bytes");
    const modeLabel = document.getElementById("mode-label");

    const encoder = new TextEncoder();
    const decoder = new TextDecoder("utf-8", { fatal: true });
    let currentAction = "encode";

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 0x8000;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode(...chunk);
      }

      return btoa(binary);
    }

    function base64ToBytes(value) {
      let normalized = value.trim();

      if (urlSafe.checked) {
        normalized = normalized.replace(/-/g, "+").replace(/_/g, "/");
      }

      normalized = normalized.replace(/\s+/g, "");

      if (!/^[A-Za-z0-9+/]*={0,2}$/.test(normalized)) {
        throw new Error("Input contains characters that are not valid Base64.");
      }

      const padLength = (4 - (normalized.length % 4)) % 4;
      normalized += "=".repeat(padLength);

      const binary = atob(normalized);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    function toUrlSafe(value) {
      return value.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function encodeValue(value) {
      const encoded = bytesToBase64(encoder.encode(value));
      return urlSafe.checked ? toUrlSafe(encoded) : encoded;
    }

    function decodeValue(value) {
      return decoder.decode(base64ToBytes(value));
    }

    function processLines(fn) {
      return input.value.split(/\r?\n/).map((line) => line ? fn(line) : "").join("\n");
    }

    function setStatus(message, type) {
      status.textContent = message;
      status.className = "status" + (type ? ` ${type}` : "");
    }

    function updateCounts() {
      inputCount.textContent = `${input.value.length.toLocaleString()} chars`;
      outputCount.textContent = `${output.value.length.toLocaleString()} chars`;
      inputBytes.textContent = encoder.encode(input.value).length.toLocaleString();
      outputBytes.textContent = encoder.encode(output.value).length.toLocaleString();
      modeLabel.textContent = urlSafe.checked ? "url-safe" : "standard";
    }

    function run(action, automatic = false) {
      currentAction = action;

      if (!input.value) {
        output.value = "";
        setStatus("Ready.", "");
        updateCounts();
        return;
      }

      try {
        output.value = lineMode.checked
          ? processLines(action === "encode" ? encodeValue : decodeValue)
          : (action === "encode" ? encodeValue(input.value) : decodeValue(input.value));

        const verb = action === "encode" ? "Encoded" : "Decoded";
        setStatus(`${verb} ${automatic ? "automatically" : "successfully"}.`, "ok");
      } catch (error) {
        output.value = "";
        setStatus(error.message || "Could not process input.", "err");
      }

      updateCounts();
    }

    async function copyOutput() {
      if (!output.value) return;
      await navigator.clipboard.writeText(output.value);
      const previous = copyButton.textContent;
      copyButton.textContent = "Copied";
      window.setTimeout(() => {
        copyButton.textContent = previous;
      }, 1200);
    }

    function runCurrent() {
      run(currentAction, true);
    }

    encodeButton.addEventListener("click", () => run("encode"));
    decodeButton.addEventListener("click", () => run("decode"));

    swapButton.addEventListener("click", () => {
      input.value = output.value;
      output.value = "";
      setStatus("Output moved to input.", "");
      updateCounts();
      input.focus();
    });

    copyButton.addEventListener("click", copyOutput);

    sampleButton.addEventListener("click", () => {
      input.value = "Micro apps are small, focused, and fast.\nこんにちは";
      run("encode");
    });

    clearButton.addEventListener("click", () => {
      input.value = "";
      output.value = "";
      setStatus("Ready.", "");
      updateCounts();
      input.focus();
    });

    input.addEventListener("input", runCurrent);
    urlSafe.addEventListener("change", runCurrent);
    lineMode.addEventListener("change", runCurrent);

    updateCounts();
  </script>
</body>

</html>
