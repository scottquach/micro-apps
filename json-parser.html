<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Parser</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:         #111111;
  --surface:    #1a1a1a;
  --surface2:   #222222;
  --surface3:   #2a2a2a;
  --border:     #303030;
  --border2:    #3e3e3e;
  --text:       #eeebe6;
  --text-dim:   #b0aca6;
  --text-muted: #787470;
  --accent:     #c4964e;
  --accent-dim: rgba(196,150,78,0.10);
  --error:      #c07878;
  --success:    #78a88e;
  --jk:    #8eb4cc;
  --js:    #c49a52;
  --jn:    #ab98c8;
  --jb:    #78a88e;
  --jnull: #b08888;
  --jbrace:#6a6358;
  --font-mono: Consolas,"Liberation Mono","Courier New",monospace;
  --font-ui: Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --r: 4px;
  --t: 0.13s ease;
}

html,body{height:100%;overflow:hidden}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.hdr {
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:42px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.logo {
  display:flex;align-items:center;gap:10px;
  font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
}
.logo-glyph {
  font-family:var(--font-mono);font-size:18px;color:var(--accent);
  font-weight:700;line-height:1;
}
.logo-name{color:var(--text)}
.logo-ver{color:var(--text-muted);font-size:10px;font-weight:400;letter-spacing:0.05em}

.validity {
  padding:3px 10px;border-radius:var(--r);
  font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  transition:all var(--t);
}
.validity.empty{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.validity.valid{background:rgba(120,168,142,.10);color:var(--success);border:1px solid rgba(120,168,142,.28)}
.validity.invalid{background:rgba(192,120,120,.10);color:var(--error);border:1px solid rgba(192,120,120,.28)}

/* ── Toolbar ── */
.toolbar {
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;height:36px;
  background:var(--surface2);border-bottom:1px solid var(--border);
  flex-shrink:0;gap:6px;
}
.tg{display:flex;align-items:center;gap:3px}
.sep{width:1px;height:16px;background:var(--border);margin:0 4px}

.btn {
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border:1px solid var(--border2);border-radius:var(--r);
  background:transparent;color:var(--text-dim);
  font-family:var(--font-ui);font-size:11.5px;font-weight:500;
  cursor:pointer;transition:all var(--t);white-space:nowrap;letter-spacing:0.02em;
}
.btn:hover{background:var(--surface3);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn.on{background:var(--accent-dim);border-color:rgba(196,150,78,.35);color:var(--accent)}
.btn-hi{background:var(--accent-dim);border-color:rgba(196,150,78,.35);color:var(--accent)}
.btn-hi:hover{background:rgba(196,150,78,.18)}

.isel {
  background:transparent;border:1px solid var(--border2);
  color:var(--text-dim);font-family:var(--font-ui);font-size:11.5px;
  padding:4px 7px;border-radius:var(--r);cursor:pointer;outline:none;
  transition:color var(--t);
}
.isel:hover{color:var(--text)}
.isel option{background:var(--surface2)}

/* ── Workspace ── */
.ws{display:flex;flex:1;overflow:hidden;min-height:0}

.panel{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.inp-panel{flex:1;border-right:1px solid var(--border)}
.out-panel{flex:1}

.ph {
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;height:30px;
  background:var(--surface2);border-bottom:1px solid var(--border);
  flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--text-muted);
}
.tabs{display:flex;gap:2px}
.tab {
  padding:3px 9px;border-radius:var(--r);
  font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);cursor:pointer;transition:all var(--t);border:1px solid transparent;
}
.tab:hover{color:var(--text-dim);background:var(--surface3)}
.tab.on{color:var(--accent);background:var(--accent-dim);border-color:rgba(196,150,78,.2)}

/* ── Editor ── */
.ed-wrap{flex:1;display:flex;overflow:hidden;position:relative}

.lns {
  flex-shrink:0;width:42px;
  padding:10px 6px 10px 2px;
  background:var(--surface2);border-right:1px solid var(--border);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.62;
  color:var(--text-muted);text-align:right;overflow:hidden;user-select:none;
}
.ln{display:block;transition:color .1s}
.ln.err{color:var(--error);font-weight:700}
.ln.err::before{content:'▶';position:absolute;left:2px;font-size:9px}

#inp {
  flex:1;padding:10px 12px;
  background:transparent;border:none;outline:none;
  resize:none;font-family:var(--font-mono);font-size:11.5px;line-height:1.62;
  color:var(--text);overflow:auto;white-space:pre;tab-size:2;
}
#inp::selection{background:rgba(196,150,78,.15)}
#inp::placeholder{color:var(--text-muted)}

/* ── Divider ── */
.dvdr{
  width:4px;background:var(--border);cursor:col-resize;
  flex-shrink:0;transition:background var(--t);
}
.dvdr:hover,.dvdr.drag{background:var(--accent)}

/* ── Output ── */
.out-content{flex:1;overflow:auto;position:relative}

#out {
  padding:10px 12px;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.62;
  white-space:pre;display:block;min-height:100%;
}

/* Syntax colors */
.jk{color:var(--jk)} .js{color:var(--js)} .jn{color:var(--jn)}
.jb{color:var(--jb)} .jnull{color:var(--jnull)} .jbrace{color:var(--jbrace)}

/* ── Error panel ── */
.err-panel {
  display:none;padding:8px 14px;
  background:rgba(192,120,120,.07);border-bottom:1px solid rgba(192,120,120,.18);
  flex-shrink:0;gap:8px;
}
.err-panel.on{display:flex;align-items:flex-start}
.err-icon{color:var(--error);font-size:13px;flex-shrink:0;margin-top:1px}
.err-title{font-size:10px;font-weight:700;color:var(--error);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.err-msg{font-family:var(--font-mono);font-size:11px;color:rgba(192,120,120,.75)}
.err-loc{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:2px}

/* ── Search bar ── */
.srch-bar {
  display:none;align-items:center;
  padding:5px 10px;gap:8px;
  background:var(--surface2);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.srch-bar.on{display:flex}
.srch-wrap {
  flex:1;display:flex;align-items:center;
  background:var(--surface3);border:1px solid var(--border2);
  border-radius:var(--r);padding:3px 9px;gap:6px;transition:border-color var(--t);
}
.srch-wrap:focus-within{border-color:rgba(196,150,78,.5)}
.srch-ico{color:var(--text-dim);font-size:11px}
#srch {
  flex:1;background:transparent;border:none;outline:none;
  font-family:var(--font-ui);font-size:12px;color:var(--text);
}
#srch::placeholder{color:var(--text-muted)}
.srch-ct{font-size:11px;color:var(--text-dim);white-space:nowrap}

/* ── Search results ── */
.srch-res {
  display:none;flex-direction:column;overflow-y:auto;max-height:180px;
  border-bottom:1px solid var(--border);background:var(--surface);
}
.srch-res.on{display:flex}
.sr-item {
  display:flex;align-items:center;padding:4px 12px;gap:7px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t);
  font-family:var(--font-mono);font-size:11px;
}
.sr-item:hover{background:var(--surface2)}
.sr-item:last-child{border-bottom:none}
.sr-path{color:var(--text-dim);min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-badge {
  font-size:9px;padding:1px 5px;border-radius:2px;
  text-transform:uppercase;letter-spacing:.08em;font-weight:700;flex-shrink:0;
}
.sr-badge.key{background:rgba(142,180,204,.10);color:var(--jk);border:1px solid rgba(142,180,204,.22)}
.sr-badge.val{background:rgba(196,150,78,.10);color:var(--js);border:1px solid rgba(196,150,78,.22)}
.sr-val{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.hl{background:rgba(196,150,78,.22);border-radius:2px;outline:1px solid rgba(196,150,78,.4)}

/* ── Tree view ── */
.tree {
  display:none;padding:10px 12px;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.7;
  overflow:auto;min-height:100%;
}
.tree.on{display:block}

.t-node{position:relative}
.t-row {
  display:flex;align-items:center;gap:3px;
  padding:0 4px;border-radius:var(--r);cursor:default;transition:background var(--t);
}
.t-row:hover{background:var(--surface3)}
.t-tog {
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;font-size:9px;color:var(--text-muted);
  cursor:pointer;user-select:none;transition:transform .2s ease;
  flex-shrink:0;border-radius:3px;
}
.t-tog:hover{background:var(--border2);color:var(--accent)}
.t-tog.coll{transform:rotate(-90deg)}
.t-key{color:var(--jk)} .t-colon{color:var(--text-muted)}
.t-ct{color:var(--text-muted);font-size:10px;margin-left:3px}
.t-brace{color:var(--jbrace)}
.t-kids {
  margin-left:18px;border-left:1px solid var(--border);
  padding-left:8px;
}
.t-kids.coll{display:none}
.tv-str{color:var(--js)} .tv-num{color:var(--jn)}
.tv-bool{color:var(--jb)} .tv-null{color:var(--jnull)}

/* ── Status bar ── */
.stbar {
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;height:22px;
  background:var(--surface2);border-top:1px solid var(--border);
  flex-shrink:0;font-size:11px;color:var(--text-dim);
}
.stats{display:flex;gap:16px}
.stat{display:flex;align-items:center;gap:4px}
.stat-lbl{color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.stat-val{color:var(--text-dim);font-family:var(--font-mono)}

/* ── Empty state ── */
.empty {
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:10px;color:var(--text-muted);padding:40px;
}
.empty-ico{font-size:28px;opacity:0.28;font-family:var(--font-mono)}
.empty-ttl{font-size:12px;font-weight:700;color:var(--text-dim);letter-spacing:.06em}
.empty-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center;line-height:1.9}

/* ── Toast ── */
.toast {
  position:fixed;bottom:32px;right:18px;
  background:var(--surface3);border:1px solid rgba(196,150,78,.4);color:var(--accent);
  padding:6px 14px;border-radius:var(--r);
  font-size:11.5px;font-weight:600;letter-spacing:.06em;
  opacity:0;transform:translateY(6px);transition:all .18s ease;
  pointer-events:none;z-index:999;
}
.toast.on{opacity:1;transform:translateY(0)}

/* ── Scrollbars ── */
*{scrollbar-width:thin;scrollbar-color:var(--border2) var(--surface)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <div class="logo">
    <span class="logo-glyph">{}</span>
    <span class="logo-name">JSON PARSER</span>
    <span class="logo-ver">v1.0</span>
  </div>
  <span class="validity empty" id="vbadge">EMPTY</span>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <div class="tg">
    <button class="btn btn-hi" id="bFmt">⌥ Format</button>
    <select class="isel" id="indent" title="Indent size">
      <option value="2">2 spaces</option>
      <option value="4">4 spaces</option>
      <option value="tab">tab</option>
    </select>
    <div class="sep"></div>
    <button class="btn" id="bCpt">⊟ Compact</button>
    <div class="sep"></div>
    <button class="btn" id="bTree">⊞ Tree</button>
  </div>
  <div class="tg">
    <button class="btn" id="bSrch">⌕ Search</button>
    <div class="sep"></div>
    <button class="btn" id="bCopy">⎘ Copy</button>
    <button class="btn" id="bClr">✕ Clear</button>
  </div>
</div>

<!-- Workspace -->
<div class="ws" id="ws">
  <!-- Input panel -->
  <div class="panel inp-panel" id="ipanel">
    <div class="ph"><span>Input</span></div>
    <div class="ed-wrap">
      <div class="lns" id="lns"></div>
      <textarea id="inp" spellcheck="false" autocomplete="off" autocorrect="off"
        placeholder='Paste or type JSON here...&#10;&#10;{"hello": "world"}'></textarea>
    </div>
  </div>

  <div class="dvdr" id="dvdr"></div>

  <!-- Output panel -->
  <div class="panel out-panel" id="opanel">
    <div class="ph">
      <span>Output</span>
      <div class="tabs">
        <div class="tab on" id="tFmt" data-t="fmt">Formatted</div>
        <div class="tab" id="tTree" data-t="tree">Tree</div>
      </div>
    </div>

    <!-- Error -->
    <div class="err-panel" id="errP">
      <span class="err-icon">⚠</span>
      <div>
        <div class="err-title">Parse Error</div>
        <div class="err-msg" id="errMsg"></div>
        <div class="err-loc" id="errLoc"></div>
      </div>
    </div>

    <!-- Search -->
    <div class="srch-bar" id="srchBar">
      <div class="srch-wrap">
        <span class="srch-ico">⌕</span>
        <input type="text" id="srch" placeholder="Search keys and values…">
      </div>
      <span class="srch-ct" id="srchCt">—</span>
    </div>
    <div class="srch-res" id="srchRes"></div>

    <!-- Formatted tab content -->
    <div class="out-content" id="cFmt">
      <code id="out"></code>
      <div class="empty" id="outEmpty">
        <div class="empty-ico">{ }</div>
        <div class="empty-ttl">No Output</div>
        <div class="empty-sub">Paste JSON in the input panel<br>then click Format or Compact</div>
      </div>
    </div>

    <!-- Tree tab content -->
    <div class="out-content" id="cTree" style="display:none">
      <div class="tree" id="treeV"></div>
      <div class="empty" id="treeEmpty" style="display:none">
        <div class="empty-ico">⊞</div>
        <div class="empty-ttl">Tree View</div>
        <div class="empty-sub">Format valid JSON first</div>
      </div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="stbar">
  <div class="stats">
    <div class="stat"><span class="stat-lbl">Lines</span><span class="stat-val" id="sLines">0</span></div>
    <div class="stat"><span class="stat-lbl">Keys</span><span class="stat-val" id="sKeys">—</span></div>
    <div class="stat"><span class="stat-lbl">Chars</span><span class="stat-val" id="sChars">0</span></div>
    <div class="stat"><span class="stat-lbl">Depth</span><span class="stat-val" id="sDepth">—</span></div>
  </div>
  <span id="sType" style="color:var(--text-muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase"></span>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let parsed = null;
let rawOutput = '';
let errLine = null;
let srchOn = false;
let treeOn = false;
let parseTimer = null;
let srchTimer = null;
let activeTab = 'fmt';

// ── Elements ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const inp = $('inp'), out = $('out'), lns = $('lns');
const vbadge = $('vbadge');
const errP = $('errP'), errMsg = $('errMsg'), errLoc = $('errLoc');
const srchBar = $('srchBar'), srch = $('srch'), srchCt = $('srchCt'), srchRes = $('srchRes');
const treeV = $('treeV'), outEmpty = $('outEmpty'), treeEmpty = $('treeEmpty');
const tFmt = $('tFmt'), tTree = $('tTree'), cFmt = $('cFmt'), cTree = $('cTree');
const bFmt = $('bFmt'), bCpt = $('bCpt'), bSrch = $('bSrch'), bTree = $('bTree');
const bCopy = $('bCopy'), bClr = $('bClr');
const toast = $('toast');

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('on');
  setTimeout(() => toast.classList.remove('on'), 1800);
}

// ── HTML escape ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Syntax highlight (tag-safe) ────────────────────────────────────────────
function highlight(json) {
  const e = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(
    /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    m => {
      if (/^"/.test(m)) return /:$/.test(m) ? `<span class="jk">${m}</span>` : `<span class="js">${m}</span>`;
      if (m==='true'||m==='false') return `<span class="jb">${m}</span>`;
      if (m==='null') return `<span class="jnull">${m}</span>`;
      return `<span class="jn">${m}</span>`;
    }
  );
}

// Highlight search term only within text nodes (between tags)
function hlSearch(html, q) {
  if (!q) return html;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return html.replace(/>([^<]*)</g, (_, t) => '>' + t.replace(re, '<mark class="hl">$1</mark>') + '<');
}

// ── Line numbers ───────────────────────────────────────────────────────────
function updateLns() {
  const lines = inp.value.split('\n');
  lns.innerHTML = lines.map((_, i) => {
    const n = i + 1;
    const cls = n === errLine ? ' err' : '';
    return `<span class="ln${cls}">${n}</span>`;
  }).join('\n');
}

inp.addEventListener('scroll', () => { lns.scrollTop = inp.scrollTop });

// ── Stats ──────────────────────────────────────────────────────────────────
function countKeys(o) {
  if (!o || typeof o !== 'object') return 0;
  let n = Array.isArray(o) ? 0 : Object.keys(o).length;
  for (const v of (Array.isArray(o) ? o : Object.values(o))) n += countKeys(v);
  return n;
}
function maxDepth(o, d=0) {
  if (!o || typeof o !== 'object') return d;
  const vs = Array.isArray(o) ? o : Object.values(o);
  return vs.length ? Math.max(...vs.map(v => maxDepth(v, d+1))) : d+1;
}
function rootType(d) {
  if (Array.isArray(d)) return 'Array';
  if (d===null) return 'Null';
  return typeof d === 'object' ? 'Object' : (typeof d).charAt(0).toUpperCase()+(typeof d).slice(1);
}

function updateStats() {
  const txt = inp.value;
  $('sLines').textContent = txt ? txt.split('\n').length.toLocaleString() : '0';
  $('sChars').textContent = txt.length.toLocaleString();
  if (parsed !== null && parsed !== undefined) {
    $('sKeys').textContent = countKeys(parsed).toLocaleString();
    $('sDepth').textContent = maxDepth(parsed);
    $('sType').textContent = rootType(parsed);
  } else {
    $('sKeys').textContent = '—';
    $('sDepth').textContent = '—';
    $('sType').textContent = '';
  }
}

// ── Parse error location ───────────────────────────────────────────────────
function errInfo(e, txt) {
  const m = e.message;
  const pm = m.match(/(?:position|character) (\d+)/i);
  if (pm) {
    const pos = +pm[1];
    const before = txt.slice(0, pos);
    const ls = before.split('\n');
    return { line: ls.length, col: ls[ls.length-1].length + 1, msg: m };
  }
  const lm = m.match(/line (\d+)\s+column (\d+)/i);
  if (lm) return { line: +lm[1], col: +lm[2], msg: m };
  return { line: null, col: null, msg: m };
}

// ── Parse ──────────────────────────────────────────────────────────────────
function tryParse() {
  const txt = inp.value.trim();
  errLine = null;
  if (!txt) {
    parsed = null;
    vbadge.className = 'validity empty'; vbadge.textContent = 'EMPTY';
    errP.classList.remove('on');
    updateStats(); updateLns();
    return false;
  }
  try {
    parsed = JSON.parse(txt);
    vbadge.className = 'validity valid'; vbadge.textContent = 'VALID ✓';
    errP.classList.remove('on');
    updateStats(); updateLns();
    return true;
  } catch(e) {
    parsed = null;
    vbadge.className = 'validity invalid'; vbadge.textContent = 'INVALID';
    const info = errInfo(e, txt);
    errLine = info.line;
    errMsg.textContent = info.msg;
    errLoc.textContent = info.line ? `Line ${info.line}, Column ${info.col}` : '';
    errP.classList.add('on');
    updateStats(); updateLns();
    return false;
  }
}

// ── Format ─────────────────────────────────────────────────────────────────
function doFormat() {
  if (!tryParse()) return;
  const ind = $('indent').value === 'tab' ? '\t' : +$('indent').value;
  rawOutput = JSON.stringify(parsed, null, ind);
  renderOutput();
  if (activeTab === 'tree') buildTreeView();
  showTab('fmt');
}

// ── Compact ────────────────────────────────────────────────────────────────
function doCompact() {
  if (!tryParse()) return;
  rawOutput = JSON.stringify(parsed);
  renderOutput();
  showTab('fmt');
}

// ── Render output ──────────────────────────────────────────────────────────
function renderOutput() {
  let h = highlight(rawOutput);
  if (srchOn && srch.value.trim()) h = hlSearch(h, srch.value.trim());
  out.innerHTML = h;
  outEmpty.style.display = 'none';
  out.style.display = 'block';
}

// ── Tab switching ──────────────────────────────────────────────────────────
function showTab(t) {
  activeTab = t;
  tFmt.classList.toggle('on', t==='fmt');
  tTree.classList.toggle('on', t==='tree');
  cFmt.style.display = t==='fmt' ? 'block' : 'none';
  cTree.style.display = t==='tree' ? 'block' : 'none';
  bTree.classList.toggle('on', t==='tree');
}

tFmt.addEventListener('click', () => showTab('fmt'));
tTree.addEventListener('click', () => {
  showTab('tree');
  if (parsed !== null) buildTreeView(); else showTreeEmpty();
});

function showTreeEmpty() {
  treeV.style.display = 'none';
  treeEmpty.style.display = 'flex';
}

// ── Tree view ──────────────────────────────────────────────────────────────
function buildTreeView() {
  treeV.innerHTML = '';
  treeEmpty.style.display = 'none';
  treeV.style.display = 'block';
  if (parsed === null && inp.value.trim() === '') { showTreeEmpty(); return; }
  treeV.appendChild(makeNode(parsed, null));
}

function makeNode(data, key) {
  const node = document.createElement('div');
  node.className = 't-node';
  const isArr = Array.isArray(data);
  const isObj = data !== null && typeof data === 'object';

  if (isObj) {
    const entries = isArr ? data.map((v,i)=>[i,v]) : Object.entries(data);
    const count = entries.length;
    const ob = isArr ? '[' : '{', cb = isArr ? ']' : '}';

    const row = document.createElement('div'); row.className = 't-row';
    const tog = document.createElement('span'); tog.className = 't-tog'; tog.innerHTML = '▾';
    const lbl = document.createElement('span');

    const keyHtml = key !== null ? `<span class="t-key">"${esc(String(key))}"</span><span class="t-colon">: </span>` : '';
    lbl.innerHTML = `${keyHtml}<span class="t-brace">${ob}</span><span class="t-ct">${count} ${isArr?'item':'key'}${count!==1?'s':''}</span>`;

    row.appendChild(tog); row.appendChild(lbl);
    node.appendChild(row);

    const kids = document.createElement('div'); kids.className = 't-kids';
    entries.forEach(([k,v]) => kids.appendChild(makeNode(v, k)));

    const closeRow = document.createElement('div'); closeRow.className = 't-row';
    closeRow.innerHTML = `<span style="width:15px;flex-shrink:0;display:inline-block"></span><span class="t-brace">${cb}</span>`;
    kids.appendChild(closeRow);
    node.appendChild(kids);

    function doToggle(e) {
      e.stopPropagation();
      const c = kids.classList.toggle('coll');
      tog.classList.toggle('coll', c);
      if (c) lbl.innerHTML = `${keyHtml}<span class="t-brace">${ob}</span><span class="t-ct">${count} ${isArr?'item':'key'}${count!==1?'s':''}</span><span class="t-brace">${cb}</span>`;
      else lbl.innerHTML = `${keyHtml}<span class="t-brace">${ob}</span><span class="t-ct">${count} ${isArr?'item':'key'}${count!==1?'s':''}</span>`;
    }
    tog.addEventListener('click', doToggle);
    row.style.cursor = 'pointer';
    row.addEventListener('click', doToggle);
  } else {
    const row = document.createElement('div'); row.className = 't-row';
    const sp = document.createElement('span'); sp.style.cssText='width:15px;flex-shrink:0;display:inline-block';
    const lbl = document.createElement('span');
    const keyHtml = key !== null ? `<span class="t-key">"${esc(String(key))}"</span><span class="t-colon">: </span>` : '';
    let vc, vd;
    if (data === null) { vc='tv-null'; vd='null'; }
    else if (typeof data==='boolean') { vc='tv-bool'; vd=String(data); }
    else if (typeof data==='number') { vc='tv-num'; vd=String(data); }
    else {
      vc='tv-str';
      const s = esc(String(data));
      vd = `"${s.length > 120 ? s.slice(0,120)+'…' : s}"`;
    }
    lbl.innerHTML = `${keyHtml}<span class="${vc}">${vd}</span>`;
    row.appendChild(sp); row.appendChild(lbl);
    node.appendChild(row);
  }
  return node;
}

// ── Search ─────────────────────────────────────────────────────────────────
function searchIn(data, q, path, results) {
  const ql = q.toLowerCase();
  if (Array.isArray(data)) {
    data.forEach((v,i) => searchIn(v, q, `${path}[${i}]`, results));
  } else if (data !== null && typeof data === 'object') {
    for (const [k,v] of Object.entries(data)) {
      const cp = path ? `${path}.${k}` : k;
      if (k.toLowerCase().includes(ql)) results.push({path:cp, type:'key', val:k});
      if (typeof v !== 'object' || v===null) {
        const sv = v===null?'null':String(v);
        if (sv.toLowerCase().includes(ql)) results.push({path:cp, type:'val', val:sv});
      }
      searchIn(v, q, cp, results);
    }
  }
}

function doSearch() {
  const q = srch.value.trim();
  if (!q || !parsed) {
    srchCt.textContent = '—';
    srchRes.innerHTML = ''; srchRes.classList.remove('on');
    if (rawOutput) renderOutput();
    return;
  }
  const results = [];
  searchIn(parsed, q, 'root', results);
  srchCt.textContent = `${results.length} match${results.length!==1?'es':''}`;

  srchRes.innerHTML = '';
  if (results.length) {
    srchRes.classList.add('on');
    results.slice(0,60).forEach(r => {
      const el = document.createElement('div'); el.className='sr-item';
      el.innerHTML = `<span class="sr-badge ${r.type}">${r.type==='key'?'key':'val'}</span>`
        + `<span class="sr-path" title="${esc(r.path)}">${esc(r.path)}</span>`
        + `<span class="sr-val" title="${esc(r.val)}">${esc(r.val.length>60?r.val.slice(0,60)+'…':r.val)}</span>`;
      srchRes.appendChild(el);
    });
    if (results.length > 60) {
      const more = document.createElement('div'); more.className='sr-item';
      more.style.cssText='color:var(--text-muted);justify-content:center;font-style:italic';
      more.textContent = `+${results.length-60} more`;
      srchRes.appendChild(more);
    }
  } else {
    srchRes.classList.remove('on');
  }

  if (rawOutput) renderOutput();
}

// ── Wire buttons ───────────────────────────────────────────────────────────
bFmt.addEventListener('click', doFormat);
bCpt.addEventListener('click', doCompact);

bTree.addEventListener('click', () => {
  const next = activeTab !== 'tree';
  if (next) {
    showTab('tree');
    if (parsed !== null) buildTreeView(); else showTreeEmpty();
  } else {
    showTab('fmt');
  }
});

bSrch.addEventListener('click', () => {
  srchOn = !srchOn;
  bSrch.classList.toggle('on', srchOn);
  srchBar.classList.toggle('on', srchOn);
  if (srchOn) srch.focus();
  else {
    srch.value = ''; srchCt.textContent = '—';
    srchRes.innerHTML = ''; srchRes.classList.remove('on');
    if (rawOutput) renderOutput();
  }
});

srch.addEventListener('input', () => {
  clearTimeout(srchTimer);
  srchTimer = setTimeout(doSearch, 180);
});
srch.addEventListener('keydown', e => { if (e.key==='Escape') bSrch.click() });

bCopy.addEventListener('click', () => {
  const txt = rawOutput || inp.value;
  if (!txt) return;
  navigator.clipboard.writeText(txt)
    .then(() => showToast('Copied ✓'))
    .catch(() => {
      const t = document.createElement('textarea');
      t.value = txt; t.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(t); t.select(); document.execCommand('copy');
      document.body.removeChild(t); showToast('Copied ✓');
    });
});

bClr.addEventListener('click', () => {
  inp.value = ''; rawOutput = ''; parsed = null; errLine = null;
  out.innerHTML = ''; out.style.display = 'none';
  outEmpty.style.display = 'flex';
  treeV.innerHTML = ''; treeV.style.display = 'none'; treeEmpty.style.display = 'none';
  srch.value = ''; srchCt.textContent = '—';
  srchRes.innerHTML = ''; srchRes.classList.remove('on');
  errP.classList.remove('on');
  vbadge.className = 'validity empty'; vbadge.textContent = 'EMPTY';
  updateLns(); updateStats();
});

// ── Input events ───────────────────────────────────────────────────────────
inp.addEventListener('input', () => {
  updateLns();
  clearTimeout(parseTimer);
  parseTimer = setTimeout(tryParse, 250);
});

inp.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = inp.selectionStart, en = inp.selectionEnd;
    inp.value = inp.value.slice(0,s) + '  ' + inp.value.slice(en);
    inp.selectionStart = inp.selectionEnd = s + 2;
    updateLns();
  }
});

// Global shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key==='F') { e.preventDefault(); doFormat(); }
  if (e.ctrlKey && e.shiftKey && e.key==='M') { e.preventDefault(); doCompact(); }
  if (e.ctrlKey && !e.shiftKey && e.key==='f' && document.activeElement !== srch) { e.preventDefault(); bSrch.click(); }
});

// ── Draggable divider ──────────────────────────────────────────────────────
const dvdr = $('dvdr'), ws = $('ws'), ipanel = $('ipanel'), opanel = $('opanel');
let dragging=false, dragX=0, dragW=0;

dvdr.addEventListener('mousedown', e => {
  dragging=true; dragX=e.clientX;
  dragW = ipanel.getBoundingClientRect().width;
  dvdr.classList.add('drag');
  document.body.style.cursor='col-resize';
  document.body.style.userSelect='none';
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const total = ws.getBoundingClientRect().width - 4;
  const nw = Math.max(180, Math.min(dragW + e.clientX - dragX, total - 180));
  ipanel.style.flex='none'; ipanel.style.width=(nw/total*100).toFixed(2)+'%';
  opanel.style.flex='1';
});
document.addEventListener('mouseup', () => {
  if (dragging) { dragging=false; dvdr.classList.remove('drag'); document.body.style.cursor=''; document.body.style.userSelect=''; }
});

// ── Init ───────────────────────────────────────────────────────────────────
updateLns();
updateStats();
out.style.display = 'none';

// Load sample button in empty state
const sampleBtn = document.createElement('button');
sampleBtn.className = 'btn'; sampleBtn.style.marginTop='14px';
sampleBtn.textContent = '⌥ Load Sample';
sampleBtn.addEventListener('click', () => {
  inp.value = JSON.stringify({
    "name": "JSON Parser","version":"1.0.0",
    "features":["parse","format","compact","search","tree view"],
    "config":{"indent":2,"theme":"dark","autoValidate":true},
    "author":{"name":"Scott","email":"scottqglobal@gmail.com"},
    "stats":{"users":1024,"requests":99999,"uptime":99.9},
    "tags":["tool","utility","dev"],
    "premium":false,"license":null
  }, null, 2);
  updateLns(); doFormat(); sampleBtn.remove();
});
outEmpty.appendChild(sampleBtn);
</script>
